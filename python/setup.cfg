[metadata]
name = stream-miner-sdk-stubs
version = 0.1.0
description = Type stubs for Stream Miner Python parser SDK authoring
long_description = file: README.md
long_description_content_type = text/markdown
license = Proprietary
keywords = stream-miner, parser-sdk, typing, stubs
url = https://github.com/RidiculousCircumstances/stream-miner-authoring-sdk
project_urls =
    Repository = https://github.com/RidiculousCircumstances/stream-miner-authoring-sdk
    Documentation = https://github.com/RidiculousCircumstances/stream-miner-authoring-sdk/tree/main/python
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Developers
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Typing :: Stubs Only

[options]
packages =
    stream_miner_sdk-stubs
include_package_data = True
python_requires = >=3.10

[options.package_data]
stream_miner_sdk-stubs = *.pyi
